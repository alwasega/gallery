services:
  - type: web
    name: darkroom-gallery
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node minimal-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheckPath: /health
    autoDeploy: true
    branch: ip1 